name: Validate Unraid template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays, after the fork's weekly upstream sync has published its image.
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils file shellcheck
      - name: Validate XML and template contract
        run: scripts/validate.sh
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Lint shell
        run: shellcheck scripts/*.sh

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - name: Boot the image and verify the container contract
        run: scripts/smoke-test.sh
