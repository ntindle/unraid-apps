name: Validate Unraid template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils file shellcheck
      - name: Validate XML and template contract
        run: scripts/validate.sh
      - name: Cross-check with PowerShell validator
        shell: pwsh
        run: scripts/validate.ps1
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Lint shell
        run: shellcheck scripts/*.sh
      - name: Check repository whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --format= HEAD
          fi

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - name: Boot Executor stable channel and verify persistence
        run: scripts/smoke-test.sh
