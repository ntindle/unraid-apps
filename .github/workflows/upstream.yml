name: Upstream

# Watches the upstream releases this repository pins and proposes each new one as a pull
# request, so its smoke test runs before anything is installed. Nothing is applied to a server:
# merging publishes a new launcher image, and installs pick it up only through Unraid.
#
# Supermemory: a new supermemory-server release becomes a pull request that moves the image's
# default version, the template's Server Version and the pinned SHA-256. The smoke test boots
# the new server here first, and its result is set on the commit as the check
# "upstream / supermemory-smoke", because a pull request opened by Actions starts no CI
# (GitHub holds its pull_request run for approval).
#
# CLIProxyAPI syncs in its own fork (ntindle/CLIProxyAPI, fork-sync-upstream.yml) and Executor
# runs the upstream image unchanged; CI's daily run smoke-tests that image.

on:
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: supermemory-server version to propose. Defaults to the latest stable release.
        required: false
        type: string

concurrency:
  group: upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supermemory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Find the release to propose
        id: release
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^ENV SUPERMEMORY_VERSION=\([^ ]*\).*/\1/p' supermemory/Dockerfile)"
          if [[ -n "${REQUESTED:-}" ]]; then
            latest="${REQUESTED}"
          else
            # Stable server releases only: server-vX.Y.Z, not drafts or release candidates.
            latest="$(gh api --paginate repos/supermemoryai/supermemory/releases \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              | sed -n 's/^server-v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -n 1)"
          fi
          [[ -n "${latest}" ]] || { echo "::error::found no stable supermemory-server release"; exit 1; }
          echo "current=${current}" >> "${GITHUB_OUTPUT}"
          echo "latest=${latest}" >> "${GITHUB_OUTPUT}"
          branch="upstream/supermemory-server-${latest}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          if [[ "${latest}" == "${current}" ]] \
            || [[ -z "${REQUESTED:-}" && "$(printf '%s\n%s\n' "${current}" "${latest}" | sort -V | tail -n 1)" == "${current}" ]]; then
            echo "propose=false" >> "${GITHUB_OUTPUT}"
            echo "supermemory-server ${current} is the latest stable release." >> "${GITHUB_STEP_SUMMARY}"
          elif git ls-remote --exit-code --heads origin "${branch}" >/dev/null \
            || [[ -z "${REQUESTED:-}" && "$(gh pr list --head "${branch}" --state all --json number --jq length)" != "0" ]]; then
            # Proposed already. A closed pull request means the release was declined, so the
            # schedule does not ask again; a manual run with that version does.
            echo "propose=false" >> "${GITHUB_OUTPUT}"
            echo "supermemory-server ${latest} is already proposed or was declined on \`${branch}\`." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "propose=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install validation tools
        if: steps.release.outputs.propose == 'true'
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils file
      - name: Move the pin and validate
        if: steps.release.outputs.propose == 'true'
        run: |
          set -euo pipefail
          scripts/bump-supermemory.sh "${{ steps.release.outputs.latest }}"
          scripts/validate.sh
      # A release that fails the smoke test is still proposed, marked failing, so it is known.
      - name: Boot the new server
        id: smoke
        if: steps.release.outputs.propose == 'true'
        continue-on-error: true
        run: scripts/smoke-test-supermemory.sh
      - name: Open the pull request
        if: steps.release.outputs.propose == 'true'
        env:
          CURRENT: ${{ steps.release.outputs.current }}
          LATEST: ${{ steps.release.outputs.latest }}
          BRANCH: ${{ steps.release.outputs.branch }}
          SMOKE: ${{ steps.smoke.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "${SMOKE}" == "success" ]]; then
            state=success
            result="The smoke test booted supermemory-server ${LATEST} in [this run](${RUN_URL}) and passed."
          else
            state=failure
            result="**The smoke test failed** for supermemory-server ${LATEST} in [this run](${RUN_URL}); do not merge until that is understood."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${BRANCH}"
          git commit --quiet --all -m "feat(supermemory): move to supermemory-server ${LATEST}"
          git push --quiet origin "${BRANCH}"
          gh api --silent "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            -f state="${state}" -f context="upstream / supermemory-smoke" \
            -f description="supermemory-server ${LATEST} smoke test: ${state}" -f target_url="${RUN_URL}"
          body="$(mktemp)"
          cat > "${body}" <<EOF
          Supermemory published [supermemory-server ${LATEST}](https://github.com/supermemoryai/supermemory/releases/tag/server-v${LATEST}); this repository pins ${CURRENT}.

          This moves the launcher image's default version, the template's **Server Version** and the pinned SHA-256 (from the release's \`manifest.json\`).

          ${result} The rest of CI is held by GitHub for approval, as for every pull request opened by Actions; approve it under Checks to run it.

          **Applying it on a server** is manual:

          1. Back up App Data. An older server may not read a database a newer one has written.
          2. Stop the container with a long timeout so the in-memory database is saved: \`docker stop -t 120 Supermemory\`.
          3. Docker → Supermemory → Edit, set **Server Version** to \`${LATEST}\` and Apply. An installed container keeps the version in its own template, so a new launcher image alone does not change the server.
          EOF
          gh pr create --base main --head "${BRANCH}" \
            --title "Move Supermemory to supermemory-server ${LATEST}" --body-file "${body}"
          echo "Proposed supermemory-server ${LATEST} on \`${BRANCH}\`; smoke test ${state}." >> "${GITHUB_STEP_SUMMARY}"
