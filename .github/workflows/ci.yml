name: CI

# Validates every template, smoke-tests each app's image, and publishes an image built here to
# GHCR when its source changed on main. The daily run catches a broken upstream :latest image,
# which is what Unraid installs.
#   latest                          moves with every build; this is the tag Unraid tracks
#   <server version>-<short commit> immutable, for rollback

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily, and on Mondays after the CLIProxyAPI fork's weekly upstream sync has published.
    - cron: "17 12 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils file shellcheck
      - name: Validate templates, profile and icons
        run: scripts/validate.sh
      - name: Check shell syntax
        run: for script in scripts/*.sh supermemory/entrypoint.sh; do bash -n "${script}"; done
      - name: Lint shell
        run: shellcheck scripts/*.sh supermemory/entrypoint.sh
      - name: Check whitespace
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git show --check --format= HEAD
          fi

  cliproxyapi-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - name: Boot the fork image and verify the container contract
        run: scripts/smoke-test-cliproxyapi.sh

  executor-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install XML tools
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - name: Boot Executor's stable channel and verify persistence
        run: scripts/smoke-test-executor.sh

  supermemory-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Boot the launcher image and verify the container contract
        run: scripts/smoke-test-supermemory.sh

  supermemory-image:
    needs: supermemory-smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The immutable tag names the last commit that touched the image source, so the image is
      # published once per source change and :latest keeps its digest across unrelated commits.
      - name: Decide whether this source is already published
        id: changed
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ENV SUPERMEMORY_VERSION=\([^ ]*\).*/\1/p' supermemory/Dockerfile)"
          commit="$(git log -1 --format=%h --abbrev=7 -- supermemory/Dockerfile supermemory/entrypoint.sh supermemory/checksums.txt)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/supermemory"
          {
            echo "IMAGE=${image}"
            echo "VERSION=${version}"
            echo "COMMIT=${commit}"
          } >> "${GITHUB_ENV}"
          if docker manifest inspect "${image}:${version}-${commit}" >/dev/null 2>&1; then
            echo "build=false" >> "${GITHUB_OUTPUT}"
            echo "\`${image}:${version}-${commit}\` is already published." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up Docker Buildx
        if: steps.changed.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        if: steps.changed.outputs.build == 'true'
        run: |
          set -euo pipefail
          version="${VERSION}"
          image="${IMAGE}"
          commit="${COMMIT}"
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${commit}" \
            --label "org.opencontainers.image.description=Launcher for Supermemory's self-hosted server on Unraid" \
            --tag "${image}:latest" \
            --tag "${image}:${version}-${commit}" \
            --push supermemory
          {
            echo "### Published"
            echo ""
            echo "- \`${image}:latest\`"
            echo "- \`${image}:${version}-${commit}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
