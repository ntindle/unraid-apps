version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - "/supermemory/postgres-image"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
