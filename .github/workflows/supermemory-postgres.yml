name: Supermemory PostgreSQL release

on:
  pull_request:
    paths:
      - 'supermemory/postgres-image/**'
      - 'scripts/*supermemory-postgres.sh'
      - '.github/workflows/supermemory-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'supermemory/postgres-image/**'
      - 'scripts/*supermemory-postgres.sh'
      - '.github/workflows/supermemory-postgres.yml'
  workflow_dispatch:

concurrency:
  group: supermemory-postgres-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Check package formatting
        working-directory: supermemory/postgres-image
        run: bun install --frozen-lockfile && bun run format:check
      - name: Build the pinned release
        run: scripts/build-supermemory-postgres.sh supermemory-postgres:candidate
      - name: Verify startup, authentication and native database persistence
        env:
          SUPERMEMORY_POSTGRES_IMAGE: supermemory-postgres:candidate
        run: scripts/smoke-test-supermemory-postgres.sh
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image that passed the contract
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          version="$(bun -e 'console.log((await Bun.file("supermemory/postgres-image/release.json").json()).version)')"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/supermemory"
          if docker manifest inspect "${image}:${version}" >/dev/null 2>&1; then
            echo "Release ${version} already exists; bump release.json before publishing changed code." >&2
            exit 1
          fi
          docker tag supermemory-postgres:candidate "${image}:${version}"
          docker push "${image}:${version}"
          docker tag supermemory-postgres:candidate "${image}:postgres"
          docker push "${image}:postgres"
          printf 'Published tested image `%s:%s` and `%s:postgres`.\n' "${image}" "${version}" "${image}" >> "${GITHUB_STEP_SUMMARY}"
